name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Um job: cada job cobra setup, install e arredonda o minuto.
  # O id `required` é o check da proteção da main e o que deploy:apply consulta.
  required:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: paths
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ci/skip-full.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:quick
      # Banco, imagem e navegador já rodaram na PR. O push na main só precisa
      # reportar `required` no SHA do merge (deploy / Wait for CI).
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.paths.outputs.skip_full != 'true')
        run: pnpm build
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.paths.outputs.skip_full != 'true')
        run: pnpm test:integration
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.paths.outputs.skip_full != 'true')
        run: pnpm test:containers
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.paths.outputs.skip_full != 'true') || (github.repository == 'Renova-AI-Tech/renova-template' && steps.paths.outputs.run_profiles == 'true')
        run: pnpm exec playwright install --with-deps chromium
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && steps.paths.outputs.skip_full != 'true')
        run: pnpm test:e2e
      - name: Matriz de perfis
        if: github.repository == 'Renova-AI-Tech/renova-template' && (github.event_name == 'workflow_dispatch' || steps.paths.outputs.run_profiles == 'true')
        run: pnpm test:profiles
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
